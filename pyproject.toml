[project]
name = "secops-actions-lab"
version = "0.1.0"
description = "PR 루프로 보안 CI(GitHub Actions)를 직접 조립·운영해 보는 실습 레포입니다."
requires-python = ">=3.12"

dependencies = [
    "flask==3.1.3",
    "jinja2==3.1.6",
    "requests==2.33.0",
]

[dependency-groups]
dev = [
    "ruff==0.9.10",
    "mypy==1.15.0",
    "pytest==9.0.3",
    "pytest-cov==6.1.1",
]

[tool.uv]
# 이 레포 자체는 설치 대상 패키지가 아닙니다.
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"app/leaky_settings.py" = ["S105"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]